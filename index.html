<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cutrin Pace Control</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="hero">
    <div>
      <div class="eyebrow">SANNTID • HASTIGHET • PRESISJON</div>
      <h1>Cutrin Pace Control</h1>
    </div>
    <div class="brand">
      <div class="cutrin">CUTRIN NORGE</div>
      <div class="rc">RC <span>ZERO</span></div>
    </div>
  </header>

  <section class="cards">
    <div class="card">
      <div class="label">NÅ LØPER</div>
      <div class="value">4 - Sørensen</div>
    </div>

    <div class="card">
      <div class="label">NESTE ESTIMERTE VEKSLING</div>
      <div class="time">15:00</div>
    </div>
  </section>

  <section class="content">
    <div class="left">
      <h2>Starttider</h2>
      <div class="runner active">
        <div class="num">3</div>
        <div class="info">
          <h3>Jan Are</h3>
          <p>Dakatoparken → Dronning Mauds Minne</p>
          <small>1.0 km • estimert 10 km/t</small>
        </div>
        <div class="times">
          <div>START <strong>14:59</strong></div>
          <div>ESTIMERT INN <strong>15:05</strong></div>
        </div>
      </div>
    </div>

    <div class="right">
      <h2>Registrer veksling</h2>
      <button>1 min siden</button>
      <button class="primary">Registrer veksling</button>
    </div>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
